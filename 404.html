<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sayfa bulunamadı — crew</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2b45d6">
  <!-- 404 alt dizinlerde de gösterilir: bütün yollar mutlak -->
  <link rel="icon" href="/test2-landing/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/test2-landing/fonts/bricolage-grotesque-700-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/test2-landing/styles.css">
  <script src="/test2-landing/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#icerik">İçeriğe geç</a>

  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="/test2-landing/" aria-label="crew ana sayfa">
        <img src="/test2-landing/favicon.svg" alt="" width="28" height="28">
        <span>crew</span>
      </a>
      <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Temayı değiştir" hidden>
        <span class="theme-toggle__label">Tema</span>
      </button>
    </div>
  </header>

  <main id="icerik">
    <section class="hero" aria-labelledby="hero-baslik">
      <div class="wrap hero__grid">
        <div class="hero__copy">
          <p class="eyebrow">Hata 404</p>
          <h1 id="hero-baslik">Bu sayfa masada yok.</h1>
          <p class="lead">Aradığınız adres taşınmış ya da hiç var olmamış olabilir. Kanıtı olmayan görev gibi, burada incelenecek bir şey bulamadık.</p>
          <div class="cta-row">
            <a class="btn btn--primary" href="/test2-landing/">Ana sayfaya dön</a>
            <a class="btn btn--ghost" href="/test2-landing/#sss">Sık sorulanlar</a>
          </div>
        </div>

        <figure class="ticket" aria-labelledby="ticket-cap">
          <figcaption id="ticket-cap" class="visually-hidden">Örnek görev fişi: istenen sayfa bulunamadığı için görev engellendi.</figcaption>
          <div class="ticket__head">
            <span class="code">HTTP-404</span>
            <span class="pill pill--high" lang="en">not found</span>
          </div>
          <p class="ticket__title">İstenen sayfayı getir</p>
          <ol class="ticket__log">
            <li><span class="st st--todo">todo</span><span>adres istendi</span></li>
            <li><span class="st st--prog">blocked</span><span>dosya bulunamadı</span></li>
          </ol>
        </figure>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <p class="brand brand--small"><img src="/test2-landing/favicon.svg" alt="" width="20" height="20"><span>crew</span></p>
      <p class="footer__note">Yapay zeka ajan ofisi. Görev, kanıt, onay.</p>
      <p class="footer__copy">© <span id="yil">2026</span> crew</p>
    </div>
  </footer>
</body>
</html>
